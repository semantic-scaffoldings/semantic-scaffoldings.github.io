</text>
<text x="28" y="119.12" fill="#17232e" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">
<tspan x="28" dy="0">How does a person specify what the system should</tspan>
<tspan x="28" dy="28.16">do?</tspan>
</text>
