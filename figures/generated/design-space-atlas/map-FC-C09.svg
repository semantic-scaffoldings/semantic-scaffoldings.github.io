<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1008" height="727" viewBox="0 0 1008 727" role="img" aria-labelledby="atlas-title atlas-description"><title id="atlas-title">Goals and constraints</title><desc id="atlas-description">How does a person specify what the system should do? Distinguish conveying intent, providing a structured or executable specification, and declaring constraints or evaluation criteria.</desc><rect width="1008" height="727" fill="white"/><text x="28" y="27" fill="#a8501c" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">
