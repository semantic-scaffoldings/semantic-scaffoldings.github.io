<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1008" height="744" viewBox="0 0 1008 744" role="img" aria-labelledby="atlas-title atlas-description"><title id="atlas-title">Shared views and perspectives</title><desc id="atlas-description">How do contributions and viewpoints become shared? Separate shared artifacts and awareness, the framing and exchange of perspectives, and control of disclosure.</desc><rect width="1008" height="744" fill="white"/><text x="28" y="27" fill="#a8501c" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">
<tspan x="28" dy="0">FC-C18 / Collaboration and perspective</tspan>
</text>
<text x="28" y="65" fill="#17232e" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700">
<tspan x="28" dy="0">Shared views and perspectives</tspan>
</text>
<text x="28" y="119.12" fill="#17232e" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">
<tspan x="28" dy="0">How do contributions and viewpoints become</tspan>
<tspan x="28" dy="28.16">shared?</tspan>
</text>
<text x="28" y="188.44" fill="#566574" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400">
<tspan x="28" dy="0">Makes people&#x27;s contributions and viewpoints available to one</tspan>
<tspan x="28" dy="25.6">another through shared representations, structured discussion,</tspan>
<tspan x="28" dy="25.6">role framing and control over what is disclosed.</tspan>
</text>
