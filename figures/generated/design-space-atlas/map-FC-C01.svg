<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1008" height="827" viewBox="0 0 1008 827" role="img" aria-labelledby="atlas-title atlas-description"><title id="atlas-title">Explaining system behaviour</title><desc id="atlas-description">Which aspect of the system is made inspectable? Separate the explanation of one result, the running process, the model across cases, and the limits of what it can establish.</desc><rect width="1008" height="827" fill="white"/><text x="28" y="27" fill="#a8501c" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">
<tspan x="28" dy="0">FC-C01 / Explanation and visibility</tspan>
</text>
<text x="28" y="65" fill="#17232e" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700">
<tspan x="28" dy="0">Explaining system behaviour</tspan>
</text>
<text x="28" y="119.12" fill="#17232e" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">
<tspan x="28" dy="0">Which aspect of the system is made inspectable?</tspan>
</text>
<text x="28" y="160.28" fill="#566574" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400">
<tspan x="28" dy="0">Makes a system&#x27;s outputs, behaviour, uncertainty or current</tspan>
<tspan x="28" dy="25.6">state inspectable, so people can understand what it is doing</tspan>
<tspan x="28" dy="25.6">and judge its results.</tspan>
</text>
