<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1008" height="675" viewBox="0 0 1008 675" role="img" aria-labelledby="atlas-title atlas-description"><title id="atlas-title">Notes, history and memory</title><desc id="atlas-description">What is kept available for continuing the work? Separate making or capturing a record, arranging material at hand, and returning to an earlier state.</desc><rect width="1008" height="675" fill="white"/><text x="28" y="27" fill="#a8501c" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">
<tspan x="28" dy="0">FC-C08 / Organisation and comparison</tspan>
</text>
<text x="28" y="65" fill="#17232e" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700">
<tspan x="28" dy="0">Notes, history and memory</tspan>
</text>
<text x="28" y="119.12" fill="#17232e" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">
<tspan x="28" dy="0">What is kept available for continuing the work?</tspan>
</text>
<text x="28" y="160.28" fill="#566574" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400">
<tspan x="28" dy="0">Keeps information and work history available through notes,</tspan>
<tspan x="28" dy="25.6">annotations, memory aids and replay, so people can revisit</tspan>
<tspan x="28" dy="25.6">and continue their work.</tspan>
</text>
