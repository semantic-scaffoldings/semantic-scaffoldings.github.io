</text>
<text x="28" y="65" fill="#17232e" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700">
<tspan x="28" dy="0">Summarising and labelling content</tspan>
</text>
<text x="28" y="119.12" fill="#17232e" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">
<tspan x="28" dy="0">How is content condensed, interpreted or recast?</tspan>
</text>
<text x="28" y="160.28" fill="#566574" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400">
<tspan x="28" dy="0">Condenses or interprets content through summaries, labels,</tspan>
<tspan x="28" dy="25.6">profiles or a change of representation, so people can grasp</tspan>
<tspan x="28" dy="25.6">what it means.</tspan>
</text>
