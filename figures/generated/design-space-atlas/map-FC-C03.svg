<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1008" height="675" viewBox="0 0 1008 675" role="img" aria-labelledby="atlas-title atlas-description"><title id="atlas-title">Summarising and labelling content</title><desc id="atlas-description">How is content condensed, interpreted or recast? Distinguish reducing a body of content, characterising an item, and changing representational kind.</desc><rect width="1008" height="675" fill="white"/><text x="28" y="27" fill="#a8501c" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">
