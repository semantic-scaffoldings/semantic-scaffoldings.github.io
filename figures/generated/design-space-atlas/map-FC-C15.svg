<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1008" height="782" viewBox="0 0 1008 782" role="img" aria-labelledby="atlas-title atlas-description"><title id="atlas-title">Instruction and paced help</title><desc id="atlas-description">What help is available, and when is it available? Instructional content, the amount or timing of support, and progression across sessions are distinct design choices. Fading is not automatically evidence of learning.</desc><rect width="1008" height="782" fill="white"/><text x="28" y="27" fill="#a8501c" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">
<tspan x="28" dy="0">FC-C15 / Guidance and feedback</tspan>
</text>
<text x="28" y="65" fill="#17232e" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700">
<tspan x="28" dy="0">Instruction and paced help</tspan>
</text>
<text x="28" y="119.12" fill="#17232e" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">
<tspan x="28" dy="0">What help is available, and when is it available?</tspan>
</text>
<text x="28" y="160.28" fill="#566574" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400">
<tspan x="28" dy="0">Provides explanations, examples and orientation, and controls</tspan>
<tspan x="28" dy="25.6">when or how much help is available through staged disclosure,</tspan>
<tspan x="28" dy="25.6">learning paths or changing support.</tspan>
</text>
