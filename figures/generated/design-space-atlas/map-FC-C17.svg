</text>
<text x="28" y="119.12" fill="#17232e" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">
<tspan x="28" dy="0">Which part of a person&#x27;s thinking is elicited?</tspan>
</text>
<text x="28" y="160.28" fill="#566574" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400">
<tspan x="28" dy="0">Asks people to express their goals, questions, explanations or</tspan>
<tspan x="28" dy="25.6">reflections, making their own reasoning available to the work.</tspan>
</text>
