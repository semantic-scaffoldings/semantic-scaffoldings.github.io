<tspan x="28" dy="0">FC-C04 / Explanation and visibility</tspan>
</text>
<text x="28" y="65" fill="#17232e" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700">
<tspan x="28" dy="0">Visual and sensory representation</tspan>
</text>
<text x="28" y="119.12" fill="#17232e" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">
<tspan x="28" dy="0">Through which form can a person perceive</tspan>
<tspan x="28" dy="28.16">meaning?</tspan>
</text>
<text x="28" y="188.44" fill="#566574" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400">
<tspan x="28" dy="0">Expresses meaning through visual form, language, sound,</tspan>
<tspan x="28" dy="25.6">touch or physical action, including translations and adaptations</tspan>
<tspan x="28" dy="25.6">that make it accessible.</tspan>
</text>
