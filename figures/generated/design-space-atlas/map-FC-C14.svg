<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1008" height="675" viewBox="0 0 1008 675" role="img" aria-labelledby="atlas-title atlas-description"><title id="atlas-title">Feedback and checking</title><desc id="atlas-description">What basis is provided for judging the work? Separate feedback about an attempt or progress, appraisals and status marks, and an active check against a reference.</desc><rect width="1008" height="675" fill="white"/><text x="28" y="27" fill="#a8501c" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">
<tspan x="28" dy="0">FC-C14 / Guidance and feedback</tspan>
</text>
<text x="28" y="65" fill="#17232e" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700">
<tspan x="28" dy="0">Feedback and checking</tspan>
</text>
<text x="28" y="119.12" fill="#17232e" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">
<tspan x="28" dy="0">What basis is provided for judging the work?</tspan>
</text>
<text x="28" y="160.28" fill="#566574" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400">
<tspan x="28" dy="0">Shows how work is progressing or how a result meets a goal,</tspan>
<tspan x="28" dy="25.6">criterion or reference. It includes feedback on attempts,</tspan>
<tspan x="28" dy="25.6">problem diagnosis, quality assessments and checks.</tspan>
</text>
