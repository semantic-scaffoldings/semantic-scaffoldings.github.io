<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1008" height="731" viewBox="0 0 1008 731" role="img" aria-labelledby="atlas-title atlas-description"><title id="atlas-title">Comparing alternatives</title><desc id="atlas-description">What is placed in a common comparison frame? The comparand distinguishes candidate selection, variation of the same object, and comparison against groups or reference points.</desc><rect width="1008" height="731" fill="white"/><text x="28" y="27" fill="#a8501c" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">
<tspan x="28" dy="0">FC-C06 / Organisation and comparison</tspan>
</text>
<text x="28" y="65" fill="#17232e" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700">
<tspan x="28" dy="0">Comparing alternatives</tspan>
</text>
<text x="28" y="119.12" fill="#17232e" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">
<tspan x="28" dy="0">What is placed in a common comparison frame?</tspan>
</text>
<text x="28" y="160.28" fill="#566574" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400">
<tspan x="28" dy="0">Places alternatives, cases or states in a common frame so</tspan>
<tspan x="28" dy="25.6">people can examine their similarities, differences and</tspan>
<tspan x="28" dy="25.6">trade-offs.</tspan>
</text>
