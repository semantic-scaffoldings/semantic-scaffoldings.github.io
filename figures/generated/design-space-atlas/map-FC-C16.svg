<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1008" height="718" viewBox="0 0 1008 718" role="img" aria-labelledby="atlas-title atlas-description"><title id="atlas-title">Structuring the workflow</title><desc id="atlas-description">How are stages, responsibilities and continuity arranged? Separate progression through work, allocation of actions and authority, and continuity across interruptions or handoffs.</desc><rect width="1008" height="718" fill="white"/><text x="28" y="27" fill="#a8501c" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">
<tspan x="28" dy="0">FC-C16 / Guidance and feedback</tspan>
</text>
<text x="28" y="65" fill="#17232e" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700">
<tspan x="28" dy="0">Structuring the workflow</tspan>
</text>
<text x="28" y="119.12" fill="#17232e" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">
<tspan x="28" dy="0">How are stages, responsibilities and continuity</tspan>
<tspan x="28" dy="28.16">arranged?</tspan>
</text>
<text x="28" y="188.44" fill="#566574" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400">
<tspan x="28" dy="0">Organises work into stages, loops, roles and decision points,</tspan>
<tspan x="28" dy="25.6">with ways to coordinate actions, hand work over, recover from</tspan>
<tspan x="28" dy="25.6">problems and resume later.</tspan>
</text>
