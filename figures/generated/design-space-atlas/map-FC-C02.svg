<tspan x="28" dy="0">Sources and evidence</tspan>
</text>
<text x="28" y="119.12" fill="#17232e" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">
<tspan x="28" dy="0">How can a result be traced or checked?</tspan>
</text>
<text x="28" y="160.28" fill="#566574" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400">
<tspan x="28" dy="0">Connects a result to its sources, supporting evidence or</tspan>
<tspan x="28" dy="25.6">underlying cases, so people can trace where it came from and</tspan>
<tspan x="28" dy="25.6">check its basis.</tspan>
</text>
