<title id="figure-title">What the interface makes reachable against what the person still does</title>
<desc id="figure-description">A matrix over the 2,311 papers coded in both fields. Rows: the facet families, with the number of papers carrying each. Columns: what the person still does. Each cell is the share of the row&#x27;s papers whose still-required work falls in the column family, with the count; a paper can sit in several columns. Descriptive; model-assisted grouping.</desc>
